<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
<title id="title">Training Transfer Analytics architecture</title>
<desc id="desc">Baseline and repeated follow-up workplace application evidence are analyzed separately from transfer conditions and business outcomes, then summarized for persistence and review.</desc>
<rect width="1200" height="320" rx="24" fill="#f7f8fa"/>
<text x="50" y="48" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#17202a">Training Transfer Analytics · longitudinal architecture</text>
<text x="50" y="76" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#59636e">Workplace application, transfer conditions, and business outcomes remain separate for interpretation.</text>

<rect x="40" y="125" width="195" height="105" rx="16" fill="#fff" stroke="#38598b" stroke-width="2"/>
<circle cx="65" cy="150" r="14" fill="#38598b"/><text x="65" y="155" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#fff">1</text>
<text x="137" y="153" text-anchor="middle" font-family="Arial" font-size="15" font-weight="600" fill="#26323d">Baseline</text>
<text x="137" y="177" text-anchor="middle" font-family="Arial" font-size="13" fill="#59636e">pre-training evidence</text>

<line x1="243" y1="177" x2="267" y2="177" stroke="#8391a1" stroke-width="2"/><path d="M259 171 L267 177 L259 183" fill="none" stroke="#8391a1" stroke-width="2"/>

<rect x="275" y="125" width="195" height="105" rx="16" fill="#fff" stroke="#38598b" stroke-width="2"/>
<circle cx="300" cy="150" r="14" fill="#38598b"/><text x="300" y="155" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#fff">2</text>
<text x="372" y="153" text-anchor="middle" font-family="Arial" font-size="15" font-weight="600" fill="#26323d">30 / 60 / 90 days</text>
<text x="372" y="177" text-anchor="middle" font-family="Arial" font-size="13" fill="#59636e">repeated follow-up</text>

<line x1="478" y1="177" x2="502" y2="177" stroke="#8391a1" stroke-width="2"/><path d="M494 171 L502 177 L494 183" fill="none" stroke="#8391a1" stroke-width="2"/>

<rect x="510" y="125" width="195" height="105" rx="16" fill="#fff" stroke="#38598b" stroke-width="2"/>
<circle cx="535" cy="150" r="14" fill="#38598b"/><text x="535" y="155" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#fff">3</text>
<text x="607" y="153" text-anchor="middle" font-family="Arial" font-size="15" font-weight="600" fill="#26323d">Application score</text>
<text x="607" y="177" text-anchor="middle" font-family="Arial" font-size="13" fill="#59636e">multi-source evidence</text>

<line x1="713" y1="177" x2="737" y2="177" stroke="#8391a1" stroke-width="2"/><path d="M729 171 L737 177 L729 183" fill="none" stroke="#8391a1" stroke-width="2"/>

<rect x="745" y="125" width="195" height="105" rx="16" fill="#fff" stroke="#38598b" stroke-width="2"/>
<circle cx="770" cy="150" r="14" fill="#38598b"/><text x="770" y="155" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#fff">4</text>
<text x="842" y="151" text-anchor="middle" font-family="Arial" font-size="14" font-weight="600" fill="#26323d">Conditions +</text>
<text x="842" y="171" text-anchor="middle" font-family="Arial" font-size="14" font-weight="600" fill="#26323d">business outcome</text>
<text x="842" y="195" text-anchor="middle" font-family="Arial" font-size="12" fill="#59636e">reported separately</text>

<line x1="948" y1="177" x2="972" y2="177" stroke="#8391a1" stroke-width="2"/><path d="M964 171 L972 177 L964 183" fill="none" stroke="#8391a1" stroke-width="2"/>

<rect x="980" y="125" width="180" height="105" rx="16" fill="#fff" stroke="#38598b" stroke-width="2"/>
<circle cx="1005" cy="150" r="14" fill="#38598b"/><text x="1005" y="155" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#fff">5</text>
<text x="1070" y="151" text-anchor="middle" font-family="Arial" font-size="14" font-weight="600" fill="#26323d">Persistence +</text>
<text x="1070" y="171" text-anchor="middle" font-family="Arial" font-size="14" font-weight="600" fill="#26323d">sensitivity</text>
<text x="1070" y="195" text-anchor="middle" font-family="Arial" font-size="12" fill="#59636e">individual + cohort</text>

<text x="50" y="275" font-family="Arial" font-size="13" fill="#59636e">Opportunity/support/tools never multiply the workplace-application score; they remain contextual diagnostics.</text>
</svg>