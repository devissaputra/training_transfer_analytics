<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
<title id="title">Training Transfer Analytics synthetic demo</title>
<desc id="desc">Six synthetic employee trajectories illustrate maintained transfer, limited opportunity, decline, source disagreement, tool-access barriers, and flat business outcomes.</desc>
<rect width="1200" height="350" rx="24" fill="#111827"/>
<text x="52" y="48" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#f9fafb">Synthetic longitudinal transfer demo</text>
<text x="52" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#aeb8c5">6 synthetic cases · baseline + 30 / 60 / 90-day follow-up · no human data.</text>

<rect x="52" y="112" width="250" height="118" rx="14" fill="#1f2937" stroke="#46556a"/>
<text x="70" y="142" font-family="Arial" font-size="13" font-weight="600" fill="#93c5fd">E01 / E02</text>
<text x="70" y="171" font-family="Arial" font-size="15" font-weight="600" fill="#f3f4f6">maintained application</text>
<text x="70" y="197" font-family="Arial" font-size="13" fill="#cbd5e1">supportive vs low opportunity</text>

<rect x="320" y="112" width="250" height="118" rx="14" fill="#1f2937" stroke="#46556a"/>
<text x="338" y="142" font-family="Arial" font-size="13" font-weight="600" fill="#93c5fd">E03</text>
<text x="338" y="171" font-family="Arial" font-size="15" font-weight="600" fill="#f3f4f6">early gain then decline</text>
<text x="338" y="197" font-family="Arial" font-size="13" fill="#cbd5e1">support conditions also weaken</text>

<rect x="588" y="112" width="250" height="118" rx="14" fill="#1f2937" stroke="#46556a"/>
<text x="606" y="142" font-family="Arial" font-size="13" font-weight="600" fill="#93c5fd">E04 / E05</text>
<text x="606" y="171" font-family="Arial" font-size="15" font-weight="600" fill="#f3f4f6">source disagreement</text>
<text x="606" y="197" font-family="Arial" font-size="13" fill="#cbd5e1">+ tool-access barrier</text>

<rect x="856" y="112" width="292" height="118" rx="14" fill="#1f2937" stroke="#46556a"/>
<text x="874" y="142" font-family="Arial" font-size="13" font-weight="600" fill="#93c5fd">E06</text>
<text x="874" y="171" font-family="Arial" font-size="15" font-weight="600" fill="#f3f4f6">application improves</text>
<text x="874" y="197" font-family="Arial" font-size="13" fill="#cbd5e1">business outcome stays flat</text>

<text x="52" y="270" font-family="Arial" font-size="14" fill="#d1d5db">The demo also runs cohort summaries and evidence-weight sensitivity for a disagreement case.</text>
<text x="52" y="299" font-family="Arial" font-size="14" fill="#d1d5db">A half-life decay example is printed only as a hypothetical simulation and is not used to create the trajectories.</text>
<text x="52" y="326" font-family="Arial" font-size="13" fill="#8995a5">Run: python scripts/run_demo.py</text>
</svg>