<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="455" viewBox="0 0 1200 455" role="img" aria-labelledby="title desc">
<title id="title">Training Transfer Analytics data flow</title>
<desc id="desc">Multi-source workplace application evidence produces an application score while transfer conditions and business outcomes remain separate, followed by longitudinal persistence and sensitivity analysis.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#52656D"/></marker></defs>
<rect width="100%" height="100%" fill="#FAFBFA"/>
<text x="60" y="64" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#1B2430">Training Transfer Analytics · data and reasoning flow</text>
<text x="60" y="98" font-family="Arial, sans-serif" font-size="17" fill="#5B6660">The design avoids collapsing application, workplace conditions, and performance into one number.</text>

<rect x="55" y="145" width="250" height="135" rx="18" fill="#E8F1F3" stroke="#87949A" stroke-width="2"/>
<text x="180" y="180" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1B2430">Application evidence</text>
<text x="180" y="207" text-anchor="middle" font-family="Arial" font-size="14" fill="#26343B">self · manager</text>
<text x="180" y="228" text-anchor="middle" font-family="Arial" font-size="14" fill="#26343B">behavior · objective</text>
<text x="180" y="251" text-anchor="middle" font-family="Arial" font-size="13" fill="#5B6660">+ confidence</text>

<line x1="310" y1="212" x2="365" y2="212" stroke="#52656D" stroke-width="3" marker-end="url(#arrow)"/>

<rect x="380" y="145" width="250" height="135" rx="18" fill="#EEF3E8" stroke="#87949A" stroke-width="2"/>
<text x="505" y="180" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1B2430">Application analysis</text>
<text x="505" y="207" text-anchor="middle" font-family="Arial" font-size="14" fill="#26343B">weighted score</text>
<text x="505" y="228" text-anchor="middle" font-family="Arial" font-size="14" fill="#26343B">coverage + disagreement</text>
<text x="505" y="251" text-anchor="middle" font-family="Arial" font-size="13" fill="#5B6660">baseline + follow-up</text>

<line x1="635" y1="212" x2="690" y2="212" stroke="#52656D" stroke-width="3" marker-end="url(#arrow)"/>

<rect x="705" y="125" width="230" height="175" rx="18" fill="#F5EDE4" stroke="#87949A" stroke-width="2"/>
<text x="820" y="160" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1B2430">Separate context</text>
<text x="820" y="188" text-anchor="middle" font-family="Arial" font-size="14" fill="#26343B">opportunity</text>
<text x="820" y="209" text-anchor="middle" font-family="Arial" font-size="14" fill="#26343B">manager · tools · peers</text>
<text x="820" y="230" text-anchor="middle" font-family="Arial" font-size="14" fill="#26343B">workflow support</text>
<text x="820" y="256" text-anchor="middle" font-family="Arial" font-size="13" fill="#5B6660">business outcome stays separate</text>

<line x1="940" y1="212" x2="980" y2="212" stroke="#52656D" stroke-width="3" marker-end="url(#arrow)"/>

<rect x="995" y="145" width="155" height="135" rx="18" fill="#ECE8F5" stroke="#87949A" stroke-width="2"/>
<text x="1072" y="180" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1B2430">Review</text>
<text x="1072" y="207" text-anchor="middle" font-family="Arial" font-size="14" fill="#26343B">persistence</text>
<text x="1072" y="228" text-anchor="middle" font-family="Arial" font-size="14" fill="#26343B">barriers</text>
<text x="1072" y="251" text-anchor="middle" font-family="Arial" font-size="14" fill="#26343B">sensitivity</text>

<text x="60" y="350" font-family="Arial" font-size="15" fill="#5B6660">Observed persistence is based on repeated measurements; no decay curve is imposed on the trajectory.</text>
<text x="60" y="379" font-family="Arial" font-size="15" fill="#5B6660">A separate hypothetical half-life utility remains available only for sensitivity exercises.</text>
</svg>